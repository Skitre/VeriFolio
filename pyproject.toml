[project]
name = "zhengyan"
version = "0.1.0"
description = "证研：基于 Harness Engineering 的可信投研多 Agent 系统（分阶段还原学习版）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3.0",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
server = [
    "uvicorn>=0.32",
    "fastmcp>=0.4",
]
local-kev = [
    "mlx-lm>=0.21; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
real-adapters = [
    "pymongo>=4.8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhengyan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
